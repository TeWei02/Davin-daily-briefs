<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="技術與商業趨勢摘要彙整 — TeWei02">
<meta name="theme-color" content="#111827">
<title>技術與商業摘要 — TeWei02</title>
<style>
:root{--bg:#fafaf9;--fg:#1f2937;--dim:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0d;--fg:#e8e6e0;--dim:#9a978f;--line:#2a2820;--accent:#93bbfd;--card:#1a1a16}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:96px 24px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.2;letter-spacing:-.02em;margin:0 0 16px}
p.lead{color:var(--dim);margin:0 0 40px;font-size:17px}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:0 0 16px}
ul{list-style:none;padding:0;margin:0 0 40px;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line);padding:14px 0;color:var(--dim)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
footer{color:var(--dim);font-size:14px;border-top:1px solid var(--line);padding-top:20px}
</style>
</head>
<body>
<main>
  <h1>技術與商業摘要</h1>
  <p class="lead">彙整技術與商業領域值得留意的資訊，依日期歸檔於此倉庫。</p>
  <h2>歸檔</h2>
  <ul>
    <li>尚無歸檔內容</li>
  </ul>
  <footer>
    <a href="https://github.com/TeWei02/Davin-daily-briefs">GitHub 倉庫</a> ·
    <a href="https://tewei02.github.io/">Te-Wei Ko</a>
  </footer>
</main>
</body>
</html>
